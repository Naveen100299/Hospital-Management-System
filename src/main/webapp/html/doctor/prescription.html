<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Patient Prescription | CityCare Hospital</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: #eef6ff;
        }

        header {
            background: linear-gradient(90deg, #0288d1, #039be5);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        .back-btn button {
            background: #01579b;
            border: none;
            color: white;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            width: 85%;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

        .section-title {
            text-align: center;
            color: #0288d1;
            font-size: 26px;
            margin-bottom: 25px;
        }

        /* =========================
           PATIENT INFO (DISABLED)
           ========================= */
        .patient-info {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            background: #e3f2fd;
            padding: 18px 22px;
            border-radius: 14px;
            margin-bottom: 28px;
            box-shadow: inset 0 0 0 1px #bbdefb;
        }

        .patient-info label {
            font-size: 13px;
            font-weight: bold;
            color: #0d47a1;
            margin-bottom: 6px;
            display: block;
        }

        .patient-info input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #90caf9;
            font-size: 16px;
            font-weight: bold;
            color: #01579b;
            background: #f5fbff;
        }

        .patient-info input:disabled {
            opacity: 1;          /* REMOVE GREY LOOK */
            cursor: not-allowed;
        }

        /* ========================= */

        .field {
            margin-bottom: 22px;
        }

        .field label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #01579b;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #ccc;
            resize: vertical;
            font-size: 15px;
        }

        .actions {
            text-align: center;
            margin-top: 30px;
        }

        .actions button {
            background: #039be5;
            border: none;
            color: white;
            padding: 14px 35px;
            border-radius: 14px;
            font-size: 16px;
            cursor: pointer;
        }

        footer {
            background: #0d47a1;
            color: white;
            text-align: center;
            padding: 14px;
            font-size: 14px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <div class="back-btn">
        <button onclick="history.back()">← Back</button>
    </div>
    <h1>CityCare Hospital</h1>
    <div></div>
</header>

<div class="container">
    <div class="section-title">Patient Prescription</div>

    <form id="prescriptionForm">

        <!-- PATIENT INFO -->
        <div class="patient-info">
            <div>
                <label>Patient ID</label>
                <input id="user_id" name="user_id" >
            </div>
            <div>
               
                <input type="hidden" id="appointment_id" name="appointment_id" >
            </div>

            <div>
                <label>Patient Name</label>
                <input id="user_name" name="user_name" >
            </div>
        </div>

        <!-- DIAGNOSIS -->
        <div class="field">
            <label>Diagnosis</label>
            <textarea id="diagnosis" name="diagnosis" rows="8"
                placeholder="Enter diagnosis..."></textarea>
        </div>

        <!-- MEDICINES -->
        <div class="field">
            <label>Medicines</label>
            <textarea id="medicines" name="medicines" rows="8"
                placeholder="Enter medicines..."></textarea>
        </div>

        <!-- ADVICE -->
        <div class="field">
            <label>Doctor Advice</label>
            <textarea id="doctor_advice" name="doctor_advice" rows="6"
                placeholder="Enter doctor advice..."></textarea>
        </div>

        <div class="actions">
            <button type="submit">Save Prescription</button>
        </div>
        <div class="back-btn">
        <button onclick="history.back()">← Back</button>
    </div>

    </form>
</div>

<footer>
    © 2025 CityCare Hospital | Patient Prescription
</footer>

<script src="../../js/doctor-js/prescription.js"></script>
</body>
</html>
