<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CityCare Hospital | Create Patient</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: #eef6ff;
        }

        /* Main container */
        .container {
            max-width: 480px;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        }

        /* Hospital name box */
        .hospital-box {
            text-align: center;
            border: 2px solid #0288d1;
            color: #0288d1;
            font-size: 22px;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        /* Form title */
        .form-title {
            text-align: center;
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            resize: none;
        }

        /* Action buttons */
        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .submit-btn {
            flex: 1;
            background: #0288d1;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .back-btn {
            flex: 1;
            background: #e3f2fd;
            color: #01579b;
            border: 1px solid #0288d1;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- CityCare with BORDER -->
    <div class="hospital-box">CityCare Hospital</div>

    <!-- Heading INSIDE form -->
    <div class="form-title">Create Patient Account</div>

    <form id="signupform">

        <div class="form-group">
            <label>Full Name *</label>
            <input type="text" name="name" required>
        </div>

        <div class="form-group">
            <label>Date of Birth *</label>
            <input type="date" name="dob" required>
        </div>

        <div class="form-group">
            <label>Gender *</label>
            <select name="gender" required>
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Phone Number *</label>
            <input type="tel" name="phone" required>
        </div>

        <div class="form-group">
            <label>Email (Optional)</label>
            <input type="email" name="email">
        </div>

        <div class="form-group">
            <label>Address *</label>
            <textarea name="address" rows="3" required></textarea>
        </div>

        
        <div class="action-row">
            <button type="submit" class="submit-btn">Create Patient</button>
            <button type="button" class="back-btn" onclick="history.back()">Back</button>
        </div>

        <div id="message"></div>
    </form>
</div>

<script src="../../js/receptionist-js/register.js"></script>
</body>
</html>
