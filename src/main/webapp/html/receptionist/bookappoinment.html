<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CityCare Hospital | Book Appointment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            margin: 0;
            background: #eef6ff;
        }

        .container {
            max-width: 500px;
            margin: 40px auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.15);
        }

        .hospital-box {
            text-align: center;
            border: 2px solid #0288d1;
            color: #0288d1;
            font-size: 22px;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .form-title {
            text-align: center;
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input[readonly] {
            background: #f4f6f8;
            cursor: not-allowed;
        }

        textarea {
            resize: none;
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .submit-btn {
            flex: 1;
            background: #0288d1;
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .back-btn {
            flex: 1;
            background: #e3f2fd;
            color: #01579b;
            border: 1px solid #0288d1;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Hospital -->
    <div class="hospital-box">CityCare Hospital</div>

    <!-- Title -->
    <div class="form-title">Book Appointment</div>

    <form id="bookappointment">

        <!-- Patient ID -->
        <div class="form-group">
            <label>Patient ID *</label>
            <input type="number" name="patid" id="patid"
                   placeholder="Enter Patient ID" required>
        </div>

        <div class="form-group">
            <label>Patient Name</label>
            <input type="text" name="patientName" id="patientName"
                   placeholder="Auto-filled from Patient ID"
                   readonly>
        </div>

        <!-- Reason -->
        <div class="form-group">
            <label>Reason for Visit</label>
            <select name="reason" required>
                <option value="">-- Select Reason --</option>

                <!-- General Medicine -->
                <option value="Fever">Fever</option>
                <option value="Cold and Cough">Cold & Cough</option>
                <option value="Headache">Headache</option>
                <option value="Body Pain">Body Pain</option>
                <option value="Stomach Pain">Stomach Pain</option>
                <option value="Vomiting">Vomiting</option>
                <option value="Weakness">Weakness / Fatigue</option>

                <!-- Cardiology -->
                <option value="Chest Pain">Chest Pain</option>
                <option value="High Blood Pressure">High Blood Pressure</option>
                <option value="Heart Palpitations">Heart Palpitations</option>
                <option value="Shortness of Breath">Shortness of Breath</option>

          </select>
        </div>

        <!-- Department -->
        <div class="form-group">
            <label>Department</label>
            <select name="department" required>
                <option value="">-- Select Department --</option>
                <option value="General_Medicine">General Medicine</option>
                <option value="Cardiology">Cardiology</option>
            </select>
        </div>

        <!-- Preferred Date -->
        <div class="form-group">
            <label>Preferred Date</label>
            <input type="date" name="appointmentDate" required>
        </div>


        <!-- Buttons -->
        <div class="action-row">
            <button type="submit" class="submit-btn">Book Appointment</button>
            <button type="button" class="back-btn" onclick="history.back()">Back</button>
        </div>

        <div id="message"></div>

    </form>
</div>

<script src="../../js/receptionist-js/bookappoinment.js"></script>
</body>
</html>
